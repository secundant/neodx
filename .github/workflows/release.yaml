name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance / trusted publishing (OIDC).
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.x
          cache: true
          run-install: true

      - name: Ensure modern npm for provenance
        run: npm install -g npm@^11.15.0

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: yarn release-publish
          version: yarn release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC trusted publishers are configured on all nine @neodx packages.
          # Do not set NPM_TOKEN here — changesets/action would write it to .npmrc
          # and npm would use the 2FA token path instead of OIDC.
          NPM_CONFIG_PROVENANCE: true
